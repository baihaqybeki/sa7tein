<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sa7tein API — Swagger UI (draft)</title>
  <!-- Aset di-vendor lokal (docs/backend/vendor) supaya halaman tetap terbuka walau CDN
       pihak ketiga lambat/diblokir di jaringan pembaca. Sumber: swagger-ui-dist@5. -->
  <link rel="stylesheet" href="./vendor/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    /* Topbar bawaan disembunyikan supaya tidak menampilkan URL palsu */
    .swagger-ui .topbar { display: none; }
    .draft-banner {
      background: #e04020; color: #fff; padding: 10px 18px;
      font-size: 13px; line-height: 1.5;
    }
    .draft-banner strong { font-weight: 800; }
    .draft-banner code { background: rgba(255,255,255,.18); padding: 1px 5px; border-radius: 4px; }
    .draft-banner a { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="draft-banner">
    <strong>DRAFT 0.1.0</strong> — kontrak ini dibuat sebelum ERD final (M1).
    Item bertanda <code>x-unresolved</code> berarti <strong>belum diputuskan PO</strong> dan
    nilainya tidak boleh ditebak. Lihat daftar lengkapnya di bagian
    <code>x-unresolved</code> pada dokumen spec.
  </div>
  <div id="swagger-ui"></div>

  <script src="./vendor/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: './openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'list',
      defaultModelsExpandDepth: 0,
      defaultModelExpandDepth: 1,
      tryItOutEnabled: true,
      displayRequestDuration: true,
      filter: true,
      persistAuthorization: true,
      tagsSorter: 'alpha',
      operationsSorter: 'alpha',
    });
  </script>
</body>
</html>
