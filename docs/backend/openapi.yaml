openapi: 3.1.0

info:
  title: Sa7tein API — Irbid MVP
  version: 0.1.0-draft
  summary: Kontrak REST + Realtime untuk platform pesan-antar Sa7tein (Irbid, Jordan).
  description: |
    **Status: DRAFT.** Dibuat lebih awal dari milestone M1 (ERD final) supaya bentuk kontrak
    bisa ditinjau lebih dulu. Sumber:

    - `za7tein-pwa/docs/product/schema-draft-v1.md` — ERD draft (17 entitas)
    - `za7tein-pwa/docs/product/prd/decision-irbid-mvp.md` — keputusan PO
    - `za7tein-pwa/docs/design/flows/INDEX.json` — 24 flow (peta `event → entity`)
    - Milestone: `docs/backend/MILESTONES.md` (M7)

    Aturan yang mengikat kontrak ini:

    1. **Snapshot > hitung ulang.** Harga, modifier, zone, dan fee di-*freeze* saat order dibuat.
    2. **Nominal uang = JOD** (display), **IDR = settlement**. Jangan mencampur keduanya dalam
       satu field; field yang bersifat settlement memakai sufiks `_idr`.
    3. **`number/pk` auto-increment.** Semua referensi adalah id numerik, bukan nama.
    4. **`UNRESOLVED` tidak ditebak.** Field/endpoint yang bergantung keputusan PO ditandai
       `x-unresolved` dan tidak boleh diisi nilai karangan.

    Perubahan apa pun pada kontrak ini wajib disertai pembaruan flow yang relevan di repo
    `za7tein-pwa` (`docs/design/flows/`), karena flow-lah yang menjadi basis requirement.
  contact:
    name: Sa7tein Backend
    url: https://github.com/baihaqybeki/sa7tein
  license:
    name: Proprietary

servers:
  # Backend yang BENAR-BENAR ada sekarang: Supabase PostgREST.
  # Path di dokumen ini = nama tabel (mis. `/orders` -> `.../rest/v1/orders`).
  # "Try it out" butuh header `apikey`, dan untuk data non-publik juga
  # `Authorization: Bearer <access_token>` dari Supabase Auth. Cara mengisinya:
  # tombol Authorize di atas -> apikey = anon key (Supabase: Settings -> API),
  # bearer = access_token hasil login. Detail: docs/backend/CONSUME.md.
  - url: https://dwzxtnfesmpobnepilhl.supabase.co/rest/v1
    description: LIVE — Supabase PostgREST (butuh apikey; JWT untuk data privat)

  # Rencana, BUKAN host aktif: DNS-nya belum ada sampai gateway REST sendiri
  # dibangun. Jangan dipakai untuk Try it out (akan gagal "could not resolve host").
  - url: https://api.sa7tein.app
    description: BELUM DIBANGUN — gateway REST sendiri (host belum diputuskan)

tags:
  - name: Auth
    description: Registrasi & sesi. Google + nomor WA E.164. **Level 1 tanpa OTP WA.**
  - name: Me
    description: Profil pengguna yang sedang login
  - name: Addresses
    description: Buku alamat + zona (haversine ke merchant saat pin disimpan)
  - name: Zones
    description: Master zona Hijazi/Syimali — milik Super Admin, dibaca semua peran
  - name: Merchants
    description: Discovery merchant & profil toko
  - name: Menus
    description: Katalog, varian, dan modifier
  - name: Tenant
    description: Onboarding merchant, approval, deposit, blacklist COD
  - name: Orders
    description: Siklus hidup order (9 status) + snapshot harga/fee/zone
  - name: Batches
    description: Batch pengantaran (gabungan order) + timer SLA
  - name: Couriers
    description: Kurir milik merchant (maks 3) + lokasi
  - name: Delivery
    description: Checkpoint pengiriman, OTP, settlement
  - name: Wallet
    description: Wallet, reserve/hold, top-up, cash-out
  - name: Ledger
    description: Ledger double-entry append-only (baca saja)
  - name: Disputes
    description: Sengketa, resolusi, banding
  - name: Ratings
    description: Ulasan merchant & hidangan + balasan
  - name: Marketing
    description: Promo dan diskon
  - name: Chat
    description: Chat in-app per order (maks 3 peserta)
  - name: Push
    description: Langganan Web Push
  - name: Ops
    description: Panel CS — monitoring, putusan level-1, blacklist
  - name: SuperAdmin
    description: Konsol pemilik platform (non-PWA) — zona, role, pajak, profit, kill switch
  - name: Webhooks
    description: Callback dari penyedia pembayaran

security:
  # PostgREST selalu butuh `apikey`; `bearerAuth` untuk data yang bukan publik.
  # Ditulis dalam SATU entri = keduanya dikirim Swagger UI saat Try it out.
  - bearerAuth: []
    apiKeyAuth: []

paths:
  # ---------------------------------------------------------------- AUTH
  /auth/google:
    post:
      tags: [Auth]
      summary: Masuk/dengar dengan Google ID token
      description: |
        Membuat akun bila belum ada. Nomor WA tetap **wajib** diisi setelahnya
        (`POST /auth/phone/verification`). Berlaku untuk customer, merchant, dan kurir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: Sesi dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi manual (nomor WA wajib, format E.164)
      description: |
        Format E.164: `+962…` (Jordan) atau `+62…` (Indonesia). Validasi format saja —
        pengiriman OTP WhatsApp **tidak** dipakai di MVP (Level 1, fallback `wa.me`).
      security: []
      x-unresolved: [AUT-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, role]
              properties:
                name: { type: string, maxLength: 80 }
                phone: { $ref: '#/components/schemas/PhoneE164' }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Masuk dengan email/nomor + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Email atau nomor E.164
                password: { type: string }
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: Sesi dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/phone/verification:
    post:
      tags: [Auth]
      summary: Kirim verifikasi nomor WA
      description: |
        Level 1: mengembalikan `waLink` (`https://wa.me/<nomor>`) sebagai fallback manual.
        **Tidak** memakai WhatsApp Business API (Level 2 ditolak di MVP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/PhoneE164' }
      responses:
        '200':
          description: Instruksi verifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  waLink: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/phone/verify:
    post:
      tags: [Auth]
      summary: Konfirmasi nomor WA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/PhoneE164' }
                code:
                  type: string
                  description: Diisi hanya bila Level 2 diaktifkan kelak
      responses:
        '200':
          description: Nomor terverifikasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Akhiri sesi
      responses:
        '204': { description: Sesi diakhiri }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil sesi aktif
      responses:
        '200':
          description: Pengguna aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- ME
  /me:
    get:
      tags: [Me]
      summary: Profil saya
      description: Untuk merchant/kurir, `name`/`address` diturunkan dari record merchant/kurir (satu sumber kebenaran).
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Me]
      summary: Perbarui profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                phone: { $ref: '#/components/schemas/PhoneE164' }
      responses:
        '200':
          description: Profil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ---------------------------------------------------------------- ADDRESSES
  /me/addresses:
    get:
      tags: [Addresses]
      summary: Daftar alamat saya
      responses:
        '200':
          description: Daftar alamat
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Addresses]
      summary: Simpan alamat baru (zone dihitung saat pin disimpan)
      x-unresolved: [ZON-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Alamat dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/addresses/{id}:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    patch:
      tags: [Addresses]
      summary: Perbarui alamat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Alamat diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
    delete:
      tags: [Addresses]
      summary: Hapus alamat
      responses:
        '204': { description: Terhapus }

  /me/favorites:
    get:
      tags: [Merchants]
      summary: Merchant favorit saya
      responses:
        '200':
          description: Daftar favorit
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MerchantSummary' }
    post:
      tags: [Merchants]
      summary: Tambahkan merchant ke favorit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId]
              properties:
                merchantId: { type: integer, format: int64 }
      responses:
        '201': { description: Ditambahkan }

  /me/favorites/{merchantId}:
    parameters:
      - { $ref: '#/components/parameters/PathMerchantId' }
    delete:
      tags: [Merchants]
      summary: Hapus dari favorit
      responses:
        '204': { description: Terhapus }

  # ---------------------------------------------------------------- ZONES
  /zones:
    get:
      tags: [Zones]
      summary: Master zona (Hijazi, Syimali, …)
      description: Zona didefinisikan Super Admin; merchant hanya mengaktifkan.
      responses:
        '200':
          description: Daftar zona
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zone' }
    post:
      tags: [SuperAdmin]
      summary: Buat zona (butuh izin `zone.write`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '201':
          description: Zona dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }

  /coverage/resolve:
    post:
      tags: [Zones]
      summary: Tentukan zona dari koordinat
      description: |
        Dipakai gate checkout & saat menyimpan pin alamat. Bila zona tidak terdeteksi,
        kembalikan `zone: null` — **jangan** menebak zona terdekat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, format: double }
                longitude: { type: number, format: double }
                merchantId: { type: integer, format: int64 }
      responses:
        '200':
          description: Hasil resolusi
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone: { oneOf: [{ $ref: '#/components/schemas/ZoneCode' }, { type: 'null' }] }
                  covered: { type: boolean }
                  distanceMeters: { type: number }
                  zoneId: { type: ['integer', 'null'], format: int64 }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- MERCHANTS
  /merchants:
    get:
      tags: [Merchants]
      summary: Discovery merchant
      description: Customer memilih merchant lebih dulu, baru menu (DEC-1041).
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Cari nama merchant }
        - { name: category, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: integer, format: int64 } }
        - { name: available, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [nearest, rating, newest] } }
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Daftar merchant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MerchantSummary' }
                  nextCursor: { type: ['string', 'null'] }

  /merchants/{id}:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    get:
      tags: [Merchants]
      summary: Detail merchant
      responses:
        '200':
          description: Detail merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Merchants]
      summary: Perbarui profil/toko saya (merchant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                photo: { type: string, format: uri }
                available: { type: boolean }
                deliveryConfig: { $ref: '#/components/schemas/DeliveryConfig' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /merchants/{id}/reviews:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    get:
      tags: [Ratings]
      summary: Ulasan merchant
      x-unresolved: [RATE-2]
      responses:
        '200':
          description: Daftar ulasan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RatingReview' }

  /merchants/{id}/couriers:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    get:
      tags: [Couriers]
      summary: Kurir yang dipekerjakan merchant ini
      description: Maksimum 3 kurir (batas ditegakkan di endpoint mutasi, bukan FK).
      responses:
        '200':
          description: Daftar kurir
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Courier' }

  # ---------------------------------------------------------------- MENUS
  /merchants/{id}/menus:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    get:
      tags: [Menus]
      summary: Menu merchant
      responses:
        '200':
          description: Daftar menu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Menu' }
    post:
      tags: [Menus]
      summary: Tambah hidangan (merchant)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }

  /menus/{id}:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    patch:
      tags: [Menus]
      summary: Perbarui hidangan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '200':
          description: Diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
    delete:
      tags: [Menus]
      summary: Hapus hidangan
      responses:
        '204': { description: Terhapus }

  /menus/{id}/variants:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    get:
      tags: [Menus]
      summary: Varian & modifier hidangan
      responses:
        '200':
          description: Daftar varian
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MenuVariant' }
    post:
      tags: [Menus]
      summary: Tambah varian
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuVariantInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuVariant' }

  # ---------------------------------------------------------------- TENANT
  /tenant/onboarding:
    post:
      tags: [Tenant]
      summary: Kirim pendaftaran tenant (merchant)
      description: Membuat merchant berstatus `pending`. Menunggu approval CS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeName, storePhone, deliveryConfig]
              properties:
                storeName: { type: string }
                storePhone: { $ref: '#/components/schemas/PhoneE164' }
                storeAddress: { type: string }
                deliveryConfig: { $ref: '#/components/schemas/DeliveryConfig' }
      responses:
        '201':
          description: Terkirim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/tenants:
    get:
      tags: [Ops]
      summary: Antrean approval tenant (CS)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, suspended, blacklisted] } }
      responses:
        '200':
          description: Antrean
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Merchant' }

  /admin/tenants/{id}/approve:
    post:
      tags: [Ops]
      summary: Setujui tenant (CS)
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: Disetujui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }

  /admin/tenants/{id}/deposit:
    post:
      tags: [Ops]
      summary: Verifikasi deposit COD (CS)
      description: Deposit COD 3,50 JOD. Approval deposit = kerja operasi CS.
      x-unresolved: [FEE-1]
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depositStatus]
              properties:
                depositStatus: { type: string, enum: [unpaid, held, released] }
                amountJod: { type: number, description: Nominal sesuai keputusan PO, bukan hardcode }
      responses:
        '200':
          description: Deposit diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }

  /admin/tenants/{id}/blacklist:
    post:
      tags: [Ops]
      summary: Blacklist COD (merchant + riskFlag customer)
      description: |
        Menandai dua sisi sekaligus: merchant `blacklisted` **dan** customer `riskFlag`.
        Pencabutan harus menyentuh keduanya. Super Admin **tidak** punya tombol ini.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, enum: [merchant, customer] }
                reason: { type: string }
                customerId: { type: integer, format: int64 }
      responses:
        '200': { description: Diterapkan }

  # ---------------------------------------------------------------- ORDERS
  /orders:
    get:
      tags: [Orders]
      summary: Daftar order (ter-scope per peran)
      description: |
        customer → order miliknya; merchant → order di tokonya; kurir → order yang
        ditugaskan; cs → semua merchant; superadmin → semua.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [cart, quotation, canceled, prepare, waitingCourier, waitingDelivery, delivery, done] } }
        - { name: merchantId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string }, description: Cari kode order / nama }
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Daftar order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  nextCursor: { type: ['string', 'null'] }
    post:
      tags: [Orders]
      summary: Buat order dari keranjang
      description: |
        Efek samping: (1) snapshot harga/modifier/zone/fee, (2) membuat **reserve** di wallet
        (`wallet_holds` → `reserved`), saldo belum berkurang. Saldo berkurang saat order `done`.
        Kirim `Idempotency-Key` — operasi ini memindahkan uang.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-unresolved: [OST-1, RSV-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Order dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /orders/{id}:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
    get:
      tags: [Orders]
      summary: Detail order
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Batalkan order
      description: Sebelum `done`, pembatalan hanya **melepas reserve** (`released`) — tidak ada potongan yang perlu di-reverse.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancelBy]
              properties:
                cancelBy: { type: string, enum: [customer, merchant, system] }
                reason: { type: string }
      responses:
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{id}/accept:
    post:
      tags: [Orders]
      summary: Terima order (merchant)
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: Diterima
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{id}/reject:
    post:
      tags: [Orders]
      summary: Tolak order (merchant)
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Ditolak
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{id}/prepare:
    post:
      tags: [Orders]
      summary: Mulai masak (menyalakan timer SLA prepare)
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      x-unresolved: [SLA-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prepTimeMinutes]
              properties:
                prepTimeMinutes: { type: integer, description: Pilihan 15/25/35 menit }
      responses:
        '200':
          description: Mulai disiapkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{id}/ready:
    post:
      tags: [Orders]
      summary: Order siap → cari kurir
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: Siap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{id}/courier/assign:
    post:
      tags: [Delivery]
      summary: Tugaskan kurir (merchant memilih kurir sendiri)
      description: Rekrutmen kurir adalah tanggung jawab merchant (maks 3 kurir per merchant).
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierId]
              properties:
                courierId: { type: integer, format: int64 }
      responses:
        '200':
          description: Kurir ditugaskan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{id}/courier/accept:
    post:
      tags: [Delivery]
      summary: Kurir menerima (atomic claim — anti double-claim)
      description: |
        Operasi compare-and-swap: hanya **satu** kurir yang menang bila beberapa menekan
        bersamaan. Yang kalah menerima `409 ORDER_ALREADY_TAKEN`.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: Diterima
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Sudah diambil kurir lain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{id}/courier/reject:
    post:
      tags: [Delivery]
      summary: Kurir menolak order
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: Ditolak, order kembali mencari kurir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{id}/checkpoints:
    post:
      tags: [Delivery]
      summary: Catat checkpoint pengiriman
      description: 4 titik verifikasi (mis. di toko, tiba, OTP, selesai). Menyalakan/hentikan timer SLA terkait.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      x-unresolved: [SLA-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckpointInput' }
      responses:
        '201':
          description: Tercatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkpoint' }

  /orders/{id}/otp/verify:
    post:
      tags: [Delivery]
      summary: Verifikasi OTP serah-terima → settle
      description: |
        Menutup delivery: reserve `reserved` → `settled`, saldo wallet berkurang di titik ini,
        dan entry ledger `order`/`delivery` dibuat.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: OTP 4 digit }
      responses:
        '200':
          description: Selesai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{id}/review:
    post:
