              type: object
              required: [key, enabled]
              properties:
                key: { type: string, enum: [cod_enabled, payout_enabled, maintenance_mode] }
                enabled: { type: boolean }
      responses:
        '200':
          description: Diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSwitch' }

  # ---------------------------------------------------------------- WEBHOOKS
  /webhooks/xendit:
    post:
      tags: [Webhooks]
      summary: Callback Xendit (VA / QRIS)
      description: |
        Wajib idempoten: provider dapat mengirim ulang callback. Verifikasi tanda tangan,
        simpan `event id` yang sudah diproses, dan **jangan** memproses ulang.
        Urutan callback tidak dijamin — jangan menganggap `paid` selalu datang terakhir.
      security: []
      x-unresolved: [WEB-1]
      parameters:
        - { name: x-callback-token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Diterima }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # Wajib untuk PostgREST. Isi dengan anon key (aman dipublikasikan; RLS yang
    # membatasi data). JANGAN pernah memakai service role key di sini.
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Anon key project Supabase (Settings → API → anon public)

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PathMerchantId:
      name: merchantId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageCursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Wajib untuk operasi yang memindahkan uang (buat order, top-up, cash-out, settle,
        putusan sengketa). Request dengan kunci sama mengembalikan hasil yang sama.
      schema: { type: string, maxLength: 64 }

  responses:
    Unauthorized:
      description: Tidak terautentikasi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Tidak punya izin untuk peran ini
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Konflik state (mis. order sudah diambil kurir lain)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Validasi gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    PhoneE164:
      type: string
      pattern: '^\+[1-9]\d{7,14}$'
      description: Nomor E.164 (+962 Jordan, +62 Indonesia). Validasi format saja di MVP.
      example: '+962790000000'

    UserRole:
      type: string
      enum: [customer, merchant, courier, cs, superadmin]

    ZoneCode:
      type: string
      description: Kode zona master (mis. Hijazi, Syimali). Daftar final ditentukan Super Admin.
      example: Hijazi

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Kode mesin (mis. ORDER_ALREADY_TAKEN, INSUFFICIENT_BALANCE)
          example: ORDER_ALREADY_TAKEN
        message: { type: string }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/UserRole' }
        email: { type: ['string', 'null'], format: email }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        verified: { type: boolean }
        status: { type: string, enum: [active, suspended] }
        name: { type: string, description: Diturunkan dari record merchant/kurir bila ada }
        role: { $ref: '#/components/schemas/UserRole' }
        merchantId: { type: ['integer', 'null'], format: int64 }
        courierId: { type: ['integer', 'null'], format: int64 }

    UserRecord:
      type: object
      description: Baris registri pengguna di konsol Super Admin (read-only).
      properties:
        id: { type: integer, format: int64 }
        role: { $ref: '#/components/schemas/UserRole' }
        name: { type: string }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        verified: { type: boolean }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        merchantId: { type: ['integer', 'null'], format: int64 }

    AuthSession:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/User' }

    AddressInput:
      type: object
      required: [label, address, latitude, longitude]
      properties:
        label: { type: string, example: Rumah }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        isDefault: { type: boolean }

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            userId: { type: integer, format: int64 }
            zone: { oneOf: [{ $ref: '#/components/schemas/ZoneCode' }, { type: 'null' }] }
            x-unresolved: [ZON-1]
            description: Zone dihitung dari haversine ke merchant saat pin disimpan.

    DeliveryConfig:
      type: object
      description: Fee dapat dihitung per radius (tier jarak) atau per area (zona).
      required: [mode]
      properties:
        mode: { type: string, enum: [radius, area] }
        radiusMeters: { type: ['integer', 'null'] }
        feeByDistance:
          type: ['array', 'null']
          items:
            type: object
            properties:
              baseJod: { type: number }
              perKmJod: { type: number }
        feeByArea:
          type: ['array', 'null']
          items:
            type: object
            properties:
              zone: { $ref: '#/components/schemas/ZoneCode' }
              feeJod: { type: number }
        activeZones:
          type: array
          description: Merchant hanya mengaktifkan zona master; tidak mendefinisikannya.
          items: { $ref: '#/components/schemas/ZoneCode' }

    ZoneInput:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/ZoneCode' }
        name: { type: string }
        polygon: { type: array, items: { type: array, items: { type: number } } }

    Zone:
      allOf:
        - $ref: '#/components/schemas/ZoneInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }

    MerchantSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        photo: { type: ['string', 'null'], format: uri }
        description: { type: ['string', 'null'] }
        available: { type: boolean }
        ratingAvg: { type: ['number', 'null'], description: Angka turunan dari ulasan }
        distanceMeters: { type: ['number', 'null'] }
        deliveryFeeFromJod: { type: ['number', 'null'] }

    Merchant:
      allOf:
        - $ref: '#/components/schemas/MerchantSummary'
        - type: object
          properties:
            userId: { type: integer, format: int64 }
            deliveryConfig: { $ref: '#/components/schemas/DeliveryConfig' }
            tenantStatus: { type: string, enum: [pending, approved, suspended, blacklisted] }
            depositJod: { type: number, description: "Deposit COD (keputusan PO: 3,50 JOD)" }
            depositStatus: { type: string, enum: [unpaid, held, released] }
            creditJod:
              type: number
              description: Modal/kredit founding (5 JOD) + cashback. Non-withdrawal.

    MerchantDossier:
      type: object
      properties:
        merchant: { $ref: '#/components/schemas/Merchant' }
        couriers:
          type: array
          items: { $ref: '#/components/schemas/Courier' }
        disputes:
          type: array
          items: { $ref: '#/components/schemas/Dispute' }
        ledger:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
        slaAlerts:
          type: array
          items:
            type: object
            properties:
              batchId: { type: integer, format: int64 }
              kind: { type: string, enum: [prepare, delivery] }
              deadline: { type: ['string', 'null'], format: date-time }

    Courier:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        merchantId: { type: integer, format: int64, description: Kurir adalah karyawan merchant (maks 3) }
        availability: { type: string, enum: [available, unavailable, busy] }
        latitude: { type: ['number', 'null'], format: double }
        longitude: { type: ['number', 'null'], format: double }
        photo: { type: ['string', 'null'], format: uri }
        vehicle: { type: ['string', 'null'] }

    MenuInput:
      type: object
      required: [name, priceJod]
      properties:
        name: { type: string }
        description: { type: string }
        priceJod: { type: number }
        available: { type: boolean }
        image: { type: ['string', 'null'], format: uri }
        stock: { type: integer }

    Menu:
      allOf:
        - $ref: '#/components/schemas/MenuInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            merchantId: { type: integer, format: int64 }
            variants:
              type: array
              items: { $ref: '#/components/schemas/MenuVariant' }

    MenuVariantInput:
      type: object
      required: [name, maxSelect, options]
      properties:
        name: { type: string, example: Ukuran }
        required: { type: boolean, description: 'true = wajib dipilih (mis. ukuran)' }
        maxSelect: { type: integer, minimum: 1, description: 1 = radio, N = checkbox }
        options:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              priceDeltaJod: { type: number, description: Boleh negatif }

    MenuVariant:
      allOf:
        - $ref: '#/components/schemas/MenuVariantInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            menuId: { type: integer, format: int64 }

    OrderInput:
      type: object
      required: [merchantId, deliveryAddressId, items, paymentMethod]
      properties:
        merchantId: { type: integer, format: int64 }
        deliveryAddressId: { type: integer, format: int64 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menuId, qty]
            properties:
              menuId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }
              modifiers:
                type: array
                items:
                  type: object
                  required: [variantId, optionId]
                  properties:
                    variantId: { type: integer, format: int64 }
                    optionId: { type: integer, format: int64 }
              note: { type: ['string', 'null'], example: tanpa bawang }
        paymentMethod: { type: string, enum: [cod, transfer, xendit_va, xendit_qris] }
        promoCode: { type: ['string', 'null'] }
        tipJod: { type: number, default: 0 }
        orderNote: { type: ['string', 'null'] }

    OrderItem:
      type: object
      description: Semua nominal adalah **snapshot** saat order dibuat, bukan hasil hitung ulang.
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64, description: 'FK ke order (entitas draft: order)' }
        menuId: { type: integer, format: int64 }
        name: { type: string, description: Snapshot nama hidangan }
        qty: { type: integer }
        unitPriceJod: { type: number }
        modifiers:
          type: array
          items:
            type: object
            properties:
              variantId: { type: integer, format: int64 }
              optionId: { type: integer, format: int64 }
              name: { type: string }
              priceDeltaJod: { type: number }
        lineTotalJod: { type: number }
        note: { type: ['string', 'null'] }

    Order:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: SA-1041, description: Satu kode dipakai di 4 peran }
        status:
          type: string
          enum: [cart, quotation, canceled, prepare, waitingCourier, waitingDelivery, delivery, done]
          x-unresolved: [OST-1]
        customerId: { type: integer, format: int64 }
        merchantId: { type: integer, format: int64 }
        deliveryAddressId: { type: integer, format: int64 }
        batchId: { type: ['integer', 'null'], format: int64 }
        courierId: { type: ['integer', 'null'], format: int64 }
        subTotalJod: { type: number }
        deliveryFeeJod: { type: number, description: Snapshot tarif }
        platformFeeJod: { type: number, description: Snapshot; nilai final UNRESOLVED (FEE-1) }
        tipJod: { type: number }
        promoId: { type: ['integer', 'null'], format: int64, description: 'FK ke marketing; null bila tanpa promo' }
        promoAmountJod: { type: number }
        totalJod: { type: number }
        zone: { $ref: '#/components/schemas/ZoneCode' }
        paymentMethod: { type: string, enum: [cod, transfer, xendit_va, xendit_qris] }
        paymentStatus: { type: string, enum: [unpaid, pending, paid, failed, refunded] }
        holdStatus:
          type: string
          enum: [none, reserved, settled, released]
          description: Tahap `cut` dihapus — saldo baru berkurang saat order `done`.
        paidAt: { type: ['string', 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        placedAt: { type: ['string', 'null'], format: date-time }
        cancelReason: { type: ['string', 'null'] }
        cancelBy: { type: ['string', 'null'], enum: [customer, merchant, system, null] }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    Batch:
      type: object
      properties:
        id: { type: integer, format: int64 }
        merchantId: { type: integer, format: int64 }
        courierId: { type: ['integer', 'null'], format: int64 }
        status: { type: string, enum: [prepare, closed, waitingCourier, waitingDelivery, delivery] }
        etaPrepareSeconds: { type: ['integer', 'null'] }
        etaDeliverySeconds: { type: ['integer', 'null'] }
        slaPrepareDeadline: { type: ['string', 'null'], format: date-time, description: Angka SLA belum final (SLA-1) }
        slaDeliveryDeadline: { type: ['string', 'null'], format: date-time }
        escalatedToAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        x-unresolved: [SLA-1]

    CheckpointInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [at_store, picked_up, arrived, otp_verified] }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        proofPhoto: { type: ['string', 'null'], format: uri }
        note: { type: ['string', 'null'] }

    Checkpoint:
      allOf:
        - $ref: '#/components/schemas/CheckpointInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            orderId: { type: integer, format: int64 }
            at: { type: string, format: date-time }

    Wallet:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        balanceJod: { type: number }
        reservedBalanceJod: { type: number, description: Terkunci oleh COD hold + payout in-flight }

    WalletHold:
      type: object
      properties:
        id: { type: integer, format: int64 }
        walletId: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        status: { type: string, enum: [none, reserved, settled, released] }
        amountJod: { type: number }
        createdAt: { type: string, format: date-time }
        settledAt: { type: ['string', 'null'], format: date-time }

    TopUp:
      type: object
      properties:
        id: { type: integer, format: int64 }
        walletId: { type: integer, format: int64 }
        amountJod: { type: number }
        amountIdr: { type: ['number', 'null'], description: Nilai settlement }
        method: { type: string, enum: [xendit_va, xendit_qris, transfer] }
        status: { type: string, enum: [pending, paid, expired, failed] }
        paymentInstructions: { type: ['object', 'null'], additionalProperties: true }
        expiresAt: { type: ['string', 'null'], format: date-time, description: Masa berlaku VA belum diputuskan (WEB-1) }
        createdAt: { type: string, format: date-time }

    CashOut:
      type: object
      properties:
        id: { type: integer, format: int64 }
        walletId: { type: integer, format: int64 }
        amountJod: { type: number }
        feeJod: { type: ['number', 'null'], description: Fee cash-out belum diputuskan (CO-1) }
        status: { type: string, enum: [requested, processing, paid, rejected] }
        destination: { type: ['string', 'null'] }
        createdAt: { type: string, format: date-time }
        x-unresolved: [CO-1]

    LedgerEntry:
      type: object
      description: Append-only. Tidak ada update/delete pada tabel ini.
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        type: { type: string, enum: [cr, db] }
        reference: { type: string, enum: [topUp, order, delivery, withdrawal, refund, hold, release] }
        amountJod: { type: number }
        orderId: { type: ['integer', 'null'], format: int64 }
        createdAt: { type: string, format: date-time }

    Dispute:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        openedBy: { type: integer, format: int64, description: Referensi id pengguna, bukan nama }
        type: { type: string, enum: [late, missing, wrong, not_delivered, payment_failed] }
        status: { type: string, enum: [open, investigating, resolved, rejected] }
        resolution: { type: ['string', 'null'], enum: [refund_customer, refund_order, resettle, no_action, null] }
        refundAmountJod: { type: ['number', 'null'] }
        resolvedBy: { type: ['integer', 'null'], format: int64 }
        resolvedAt: { type: ['string', 'null'], format: date-time }
        windowClosesAt: { type: ['string', 'null'], format: date-time, description: Window 24 jam bersifat sementara (DSP-1) }
        x-unresolved: [DSP-1]

    RatingReview:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        merchantId: { type: ['integer', 'null'], format: int64, description: Terisi XOR menuId }
        menuId: { type: ['integer', 'null'], format: int64 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        review: { type: ['string', 'null'] }
        createdAt: { type: string, format: date-time }

    ReviewReply:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reviewId: { type: integer, format: int64 }
        merchantId: { type: integer, format: int64 }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    MarketingInput:
      type: object
      required: [type, value, activeFrom, activeTo]
      properties:
        type: { type: string, enum: [promo_delivery, discount_pct, discount_fixed] }
        value: { type: number }
        code: { type: ['string', 'null'], description: null = terapkan otomatis }
        activeFrom: { type: string, format: date-time }
        activeTo: { type: string, format: date-time }
        maxUses: { type: ['integer', 'null'] }

    Marketing:
      allOf:
        - $ref: '#/components/schemas/MarketingInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            usedCount: { type: integer }

    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        chatId: { type: integer, format: int64 }
        senderId: { type: integer, format: int64 }
        senderRole: { $ref: '#/components/schemas/UserRole' }
        channel: { type: string, enum: [customer-merchant, merchant-courier, courier-customer] }
        body: { type: string }
        at: { type: string, format: date-time }
        readAt: { type: ['string', 'null'], format: date-time }

    ChatThread:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        participants:
          type: array
          description: Maksimum 3 peserta (customer, merchant, kurir).
          items: { type: integer, format: int64 }
        lastMessage: { type: ['string', 'null'] }
        lastAt: { type: ['string', 'null'], format: date-time }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }

    LiabilitySummary:
      type: object
      description: Kewajiban = saldo wallet customer + merchant + tips kurir (bukan gaji kurir).
      properties:
        customerBalancesJod: { type: number }
        merchantBalancesJod: { type: number }
        courierTipsJod: { type: number }
        totalLiabilityJod: { type: number }
        asOf: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: ['integer', 'null'], format: int64, description: Operator pelaku. Bukan string nama. }
        actorRole: { $ref: '#/components/schemas/UserRole' }
        action: { type: string }
        target: { type: string, description: Taksonomi target belum diputuskan (AUD-1) }
        targetId: { type: ['integer', 'null'], format: int64 }
        at: { type: string, format: date-time }
        x-unresolved: [AUD-1]

    TaxReport:
      type: object
      properties:
        period: { type: string, example: '2026-10' }
        platformFeeJod: { type: number }
        gstJod: { type: ['number', 'null'], description: Tarif final belum diputuskan (TAX-1) }
        otherTaxJod: { type: ['number', 'null'] }
        totalTaxJod: { type: ['number', 'null'] }
        exportUrl: { type: ['string', 'null'], format: uri, description: Format ekspor belum diputuskan (TAX-2) }
        x-unresolved: [TAX-1, TAX-2]

    PlatformProfit:
      type: object
      properties:
        balanceJod: { type: number }
        withdrawableJod: { type: number }
        periodGrossJod: { type: number }
        periodCostJod: { type: number }
        asOf: { type: string, format: date-time }

    PlatformSwitch:
      type: object
      properties:
        key: { type: string, enum: [cod_enabled, payout_enabled, maintenance_mode] }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: ['integer', 'null'], format: int64 }

    Customer:
      type: object
      description: Entitas draft #3. Menampung status risiko customer.
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64, description: 'FK users (draft: users)' }
        name: { type: string }
        riskFlag:
          type: boolean
          description: Blacklist COD — ditandai Super Admin. Blacklist menyentuh dua sisi (merchant + customer).

    FavMerchant:
      type: object
      description: Entitas draft #6 — merchant favorit customer.
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        merchantId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    PhoneVerification:
      type: object
      description: Verifikasi nomor WA (Level 1 — validasi format, tanpa OTP WA).
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        method: { type: string, enum: [format_only, wa_otp] }
        code: { type: ['string', 'null'] }
        verifiedAt: { type: ['string', 'null'], format: date-time }
