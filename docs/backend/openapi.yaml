      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingReview' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- BATCHES
  /batches:
    get:
      tags: [Batches]
      summary: Daftar batch
      parameters:
        - { name: merchantId, in: query, schema: { type: integer, format: int64 } }
