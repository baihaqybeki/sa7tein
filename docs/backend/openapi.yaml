x-traceability:
  description: |
    Peta requirement → flow → endpoint/event, supaya kontrak bisa ditelusuri balik ke PRD & flow.
    Sumber: `za7tein-pwa/docs/design/flows/INDEX.json` §trace dan `source.md` (R-*).
    Requirement yang belum punya baris di sini berarti **belum dipetakan** — jangan diasumsikan tercakup.
  requirements:
    - id: R-COD-01
      flows: [f1-order-lifecycle, f2-cod-hold, f24-payment-methods]
      entities: [Order, WalletHold, LedgerEntry, Payment]
      operations:
        - 'POST /orders'
        - 'POST /orders/{id}/otp/verify'
        - 'POST /orders/{id}/cancel'
        - 'GET /wallet/holds'
      events: [reserve_created, reserve_settled, reserve_released, payment_confirmed]
    - id: R-TOPUP-01
      flows: [f3-wallet-topup]
      entities: [TopUp, Wallet, LedgerEntry]
      operations: ['POST /wallet/topups', 'GET /wallet/topups/{id}']
      events: [top_up_completed, topup_gate_pending]
    - id: R-WALLET-01
      flows: [f3-wallet-topup, f6-cashout-payout]
      entities: [Wallet, LedgerEntry]
      operations: ['GET /wallet', 'POST /wallet/cashouts']
      events: [ledger_entry]
    - id: R-FEE-01
      flows: [f4-fee-tax]
      entities: [Order, Fee]
      operations: ['POST /orders']
      events: [fee_computed]
    - id: R-TAX-01
      flows: [f4-fee-tax]
      entities: [Tax, TaxReport]
      operations: ['GET /superadmin/tax-reports']
      events: []
      unresolved: [TAX-1, TAX-2]
    - id: R-DELIV-01
      flows: [f5-delivery-verification, f13-courier-view]
      entities: [Order, Checkpoint, WalletHold]
      operations:
        - 'POST /orders/{id}/courier/assign'
        - 'POST /orders/{id}/courier/accept'
        - 'POST /orders/{id}/checkpoints'
        - 'POST /orders/{id}/otp/verify'
      events: [checkpoint_recorded, courier_match, otp_verified]
      unresolved: [SLA-1]
    - id: R-CASHOUT-01
      flows: [f6-cashout-payout]
      entities: [CashOut, Wallet]
      operations: ['POST /wallet/cashouts']
      events: [cashout_requested]
      unresolved: [CO-1]
    - id: R-LEDGER-01
      flows: [f7-ledger-liability]
      entities: [LedgerEntry, LiabilitySummary]
      operations: ['GET /ledger', 'GET /admin/liability']
      events: [ledger_entry, ledger_monitored]
    - id: R-DISPUTE-01
      flows: [f8-dispute, f15-super-admin]
      entities: [Dispute, ProtectionFund]
      operations:
        - 'POST /disputes'
        - 'POST /disputes/{id}/resolve'
        - 'POST /disputes/{id}/appeals'
      events: [dispute_opened, dispute_resolved, appeal_decided]
      unresolved: [DSP-1, APL-1]
    - id: R-INCENTIVE-01
      flows: [f9-incentive]
      entities: [MerchantCredit, CashbackTier]
      operations: []
      events: [fee_deducted_from_credit]
      unresolved: [INC-1]
    - id: R-CURR-01
      flows: [f10-exchange-rate]
      entities: [ExchangeRate]
      operations: []
      events: [rate_fetched]
      unresolved: [FX-1]
    - id: R-PUSH-01
      flows: [f11-push-notification]
      entities: [PushSubscription]
      operations: ['POST /push/subscriptions']
      events: [push_sent, wa_fallback_ready]
    - id: R-RATE-01
      flows: [f19-rating-review, f18-order-state]
      entities: [RatingReview, ReviewReply]
      operations: ['POST /orders/{id}/review', 'POST /reviews/{id}/reply']
      events: [review_prompt, review_saved]
      unresolved: [RATE-1, RATE-2]
    - id: R-ADDR-01
      flows: [f20-address-zone]
      entities: [Address, Zone, Merchant]
      operations: ['POST /coverage/resolve', 'POST /me/addresses']
      events: [coverage_checked, order_zone_snapshot, zone_master_defined]
      unresolved: [ZON-1]

x-realtime:
  description: |
    Kanal realtime memakai WebSocket. Nama event diambil dari
    `za7tein-pwa/docs/design/flows/INDEX.json` supaya kontrak dan flow tidak menyimpang.
    Payload tiap event adalah objek entitas yang bersangkutan (bentuk sama dengan REST).
  transport: websocket
  auth:
    queryParam: access_token
    note: Token sesi yang sama dengan REST; kanal hanya mengirim data yang boleh dilihat peran itu.
  channels:
    - topic: orders
      scope: '[role-scoped]'
      events:
        - { name: order_created, entity: Order, source: "f1-order-lifecycle" }
        - { name: order_status_changed, entity: Order, source: "f18-order-state" }
        - { name: order_accepted, entity: Order, source: "f12-merchant-console" }
        - { name: merchant_ready, entity: Order, source: "f18-order-state" }
        - { name: courier_match, entity: Order, source: "f12-merchant-console:assign" }
        - { name: otp_verified, entity: Order, source: "f13-courier-view:selesai" }
        - { name: fee_computed, entity: Fee, source: "f1-order-lifecycle:checkout" }
        - { name: payment_method_selected, entity: Order, source: "f1-order-lifecycle:payMethod" }
        - { name: order_zone_snapshot, entity: Order, source: "f20-address-zone:order" }
        - { name: review_prompt, entity: Order, source: "f18-order-state:done" }
        - { name: merchant_selected, entity: Merchant, source: "f23-customer-discovery:lanjut" }
        - { name: order_created, entity: Order, source: "-", x-source: "tambahan: tidak ada di flows/INDEX.json" }
    - topic: wallet
      scope: '[user]'
      events:
        - { name: reserve_created, entity: WalletHold, source: "f1-order-lifecycle:order" }
        - { name: reserve_settled, entity: WalletHold, source: "f1-order-lifecycle:otp" }
        - { name: reserve_released, entity: WalletHold, source: "f1-order-lifecycle:batal" }
        - { name: top_up_completed, entity: TopUp, source: "f3-wallet-topup" }
        - { name: ledger_entry, entity: LedgerEntry, source: "f7-ledger-liability" }
        - { name: cashout_requested, entity: CashOut, source: "f6-cashout-payout" }
        - { name: fee_deducted_from_credit, entity: MerchantCredit, source: "f9-incentive" }
        - { name: payment_confirmed, entity: Payment, source: "f17-payment-xendit:paid" }
        - { name: topup_gate_pending, entity: Wallet, source: "f21-account-auth:order" }
    - topic: chat
      scope: '[order:participants]'
      events:
        - { name: chat_opened, entity: ChatThread, source: "f14-chat-order:placed" }
        - { name: courier_joined_chat, entity: ChatThread, source: "f13-courier-view:selesai" }
        - { name: message_created, entity: ChatMessage, source: "f14-chat-order", x-source: "tambahan: tidak ada di flows/INDEX.json" }
    - topic: courier
      scope: '[merchant,order]'
      events:
        - { name: courier_location_updated, entity: Courier, source: "f13-courier-view" }
        - { name: checkpoint_recorded, entity: Checkpoint, source: "f5-delivery-verification", aliases: ["checkpoint_*"] }
        - { name: courier_location_updated, entity: Courier, source: "-", x-source: "tambahan: tidak ada di flows/INDEX.json" }
    - topic: disputes
      scope: '[cs,superadmin,order:parties]'
      events:
        - { name: dispute_opened, entity: Dispute, source: "f8-dispute" }
        - { name: dispute_resolved, entity: Dispute, source: "f15-super-admin:dispute" }
        - { name: verdict_appealed, entity: Dispute, source: "f15-super-admin:dispute" }
        - { name: appeal_decided, entity: Dispute, source: "f22-super-admin-sa:appeal" }
    - topic: tenant
      scope: '[cs,superadmin,merchant]'
      events:
        - { name: tenant_submitted, entity: Merchant, source: "f16-merchant-onboarding:submit" }
        - { name: deposit_held, entity: Merchant, source: "f15-super-admin:deposit" }
        - { name: cod_blocked, entity: Merchant, source: "f15-super-admin:blacklist" }
        - { name: tenant_signup, entity: Merchant, source: "f21-account-auth:onboard" }
        - { name: delivery_config_set, entity: Merchant, source: "f16-merchant-onboarding:profil" }
    - topic: zone
      scope: '[all]'
      events:
        - { name: zone_master_defined, entity: Zone, source: "f22-super-admin-sa:zone" }
        - { name: coverage_checked, entity: Zone, source: "f20-address-zone:gate" }
    - topic: ratings
      scope: '[merchant,customer,cs]'
      events:
        - { name: review_saved, entity: RatingReview, source: "f19-rating-review:submit" }
    - topic: platform
      scope: '[superadmin,cs]'
      events:
        - { name: liability_view, entity: LiabilitySummary, source: "f15-super-admin:liability" }
        - { name: ledger_monitored, entity: LedgerEntry, source: "f7-ledger-liability" }
        - { name: push_sent, entity: PushSubscription, source: "f11-push-notification" }
        - { name: rate_fetched, entity: ExchangeRate, source: "f10-exchange-rate" }
        - { name: wa_fallback_ready, entity: PhoneVerification, source: "f21-account-auth:phone" }

x-unresolved:
  description: |
    Item ini **tidak boleh diisi dengan tebakan**. Setiap endpoint/field yang bergantung
    padanya sudah ditandai `x-unresolved`. Pemilik keputusan adalah PO, kecuali disebut lain.
  items:
    - id: SLA-1
      sourceIds: [DEC-1037]
      topic: Angka SLA prepare/delivery (15/30/10 masih sementara)
      affects: ["Batch.slaPrepareDeadline", "Batch.slaDeliveryDeadline", "POST /orders/{id}/prepare", "POST /orders/{id}/checkpoints"]
    - id: FEE-1
      sourceIds: [DEC-1037, DEC-1038]
      topic: Rincian fee final per metode (0,37 JOD platform; merchant 0,15 + customer 0,22)
      affects: ["Order.platformFeeJod", "POST /admin/tenants/{id}/deposit"]
    - id: TAX-1
      sourceIds: [OQ-2, OQ-3, OQ-4, OQ-17, OQ-18]
      topic: Tarif pajak final (GST Jordan + pajak fee platform)
      affects: ["TaxReport.gstJod", "GET /superadmin/tax-reports"]
      owner: konsultan pajak
    - id: TAX-2
      sourceIds: [decision-irbid-mvp (export laporan pajak)]
      topic: Format ekspor laporan pajak (CSV/PDF), periode fiskal, penerima laporan
      affects: ["TaxReport.exportUrl"]
    - id: CO-1
      sourceIds: [OQ-16, OQ-22]
      topic: Fee cash-out
      affects: ["CashOut.feeJod", "POST /wallet/cashouts"]
    - id: FX-1
      sourceIds: [OQ-26, OQ-28]
      topic: Provider kurs IDR/JOD + jadwal pembaruan
      affects: ["TopUp.amountIdr", "POST /wallet/topups"]
    - id: DSP-1
      sourceIds: [OQ-29]
      topic: Kategori + SLA resolusi sengketa (window 24 jam bersifat sementara)
      affects: ["Dispute.windowClosesAt", "POST /disputes", "POST /disputes/{id}/resolve"]
    - id: RSV-1
      sourceIds: [decision-irbid-mvp (expiry reserve)]
      topic: Apakah reserve punya batas waktu/expiry bila order menggantung
      affects: ["WalletHold", "POST /orders"]
    - id: OST-1
      sourceIds: [schema-draft-v1 (quotation vs placed), C-17]
      topic: 'Bahasa status: `quotation` (draft BE) vs `placed` (flow F1)'
      affects: ["Order.status"]
    - id: AUD-1
      sourceIds: [decision-irbid-mvp (taksonomi target audit)]
      topic: Taksonomi `audit_logs.target` (masih string tampilan)
      affects: ["AuditEntry.target"]
    - id: AUT-1
      sourceIds: [AUTH-1, OQ-24, OQ-30]
      topic: Auth Super Admin & operator CS (konsol SA belum punya login)
      affects: ["POST /auth/register", "POST /auth/login"]
    - id: ZON-1
      sourceIds: [C-13, f20]
      topic: Perhitungan zone saat simpan pin (haversine ke merchant) — ambang & aturan final
      affects: ["Address.zone", "POST /me/addresses", "POST /coverage/resolve"]
    - id: RATE-1
      sourceIds: [BRS rating-review-2026-09-22]
      topic: Jendela pengisian ulasan, edit/hapus, tag cepat, moderasi, ambang rata-rata
      affects: ["POST /orders/{id}/review"]
    - id: RATE-2
      sourceIds: [X-MR-1]
      topic: Apakah ulasan + balasan merchant masuk lingkup MVP
      affects: ["GET /merchants/{id}/reviews", "POST /reviews/{id}/reply"]
    - id: CHAT-1
      sourceIds: [C-18 (retensi chat)]
      topic: Retensi chat (N hari)
      affects: ["ChatThread", "ChatMessage"]
    - id: MKT-1
      sourceIds: [MARK-1]
      topic: Apakah marketing/promo masuk MVP
      affects: ["GET /promos", "POST /promos", "POST /promos/validate"]
    - id: APL-1
      sourceIds: [decision-irbid-mvp (aturan banding)]
      topic: Aturan banding sengketa (siapa boleh mengajukan, window/SLA)
      affects: ["POST /disputes/{id}/appeals"]
    - id: WEB-1
      sourceIds: [OQ-25]
      topic: Idempotency key, retry webhook, dan masa berlaku VA Xendit
      affects: ["POST /webhooks/xendit", "TopUp.expiresAt"]
    - id: INC-1
      sourceIds: [I-4, I-5]
      topic: Insentif merchant — I-4/I-5 belum diputuskan
      affects: ["MerchantCredit", "CashbackTier"]
